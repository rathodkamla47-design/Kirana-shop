name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract final app
        run: unzip -q shri_airavat_foods_final_v2.zip -d project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        working-directory: project
        run: ../gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "APK files created:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shri-airavat-foods-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
