name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract WhatsApp Bill app
        run: |
          unzip -q shri_airavat_foods_WHATSAPP_BILL_v1.zip -d project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build Release APK
        working-directory: project
        run: ../gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        working-directory: project
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/
