name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q shri_airavat_foods_app_v1.zip -d project

      - name: Copy Firebase config
        run: |
          cp google-services.json project/kirana_shop_flutter_build_ready/app/google-services.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build APK
        working-directory: project/kirana_shop_flutter_build_ready
        run: |
          ../gradle-8.7/bin/gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shri-airavat-foods-apk
          path: project/kirana_shop_flutter_build_ready/app/build/outputs/apk/release/app-release.apk
