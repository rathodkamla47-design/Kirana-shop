name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract final app
        run: |
          unzip -q shri_airavat_foods_final_v2_fixed.zip -d project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip

      - name: Build Release APK
        working-directory: project
        run: ../gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        working-directory: project
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          keytool -genkeypair -v \
            -keystore "$HOME/shri-airavat-debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$APK" app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/shri-airavat-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shri-airavat-foods-apk
          path: project/app-release.apk
          if-no-files-found: error
